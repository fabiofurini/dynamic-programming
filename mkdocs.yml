# mkdocs.yml (English): generated by python/genera_sito.py from python/mkdocs_modello_en.yml (LINGUA=en).
# Do not edit mkdocs.yml by hand.
site_name: Dynamic Programming · Fabio Furini
site_url: https://fabiofurini.github.io/dynamic-programming/
site_description: >-
  Lecture notes on dynamic programming: principles, DP algorithms for the 0/1, unbounded, bounded, multiple-choice, multidimensional and multiple knapsack problems, subset sum, knapsack with setups, uncapacitated and capacitated lot sizing, coin change and rod cutting, with exercises and interactive apps.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/dynamic-programming
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/dynamic-programming/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-line
      link: https://fabiofurini.github.io/lp-modelling/
      name: LP Modelling
    - icon: material/chart-bell-curve-cumulative
      link: https://fabiofurini.github.io/nlp-modelling/
      name: NLP Modelling
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/vector-polyline
      link: https://fabiofurini.github.io/integer-linear-programming/
      name: Integer Linear Programming
    - icon: material/math-integral
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algorithms/
      name: Algorithms
    - icon: material/hexagon-multiple-outline
      link: https://fabiofurini.github.io/combinatorial-optimization/
      name: Combinatorial Optimization Problems
    - icon: material/graph-outline
      link: https://fabiofurini.github.io/network-optimization/
      name: Network Optimization
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/programmazione-dinamica/
      lang: it

extra_css:
  - stylesheets/collana.css
  - stylesheets/extra.css?v=ff8e75aca3
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=c51ac2286b
  - stylesheets/quiz.css?v=9e3792b41c

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/collana.js?v=cdc41dfff0
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=01373df78e
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=39321dc727
  - javascripts/gi-comune.js?v=40df75e3e5
  - javascripts/gi-pd-0.js?v=49732ed445
  - javascripts/gi-pd-a.js?v=cdd97906a5
  - javascripts/gi-pd-b.js?v=9e0e682b74
  - javascripts/quiz.js?v=be7fae2b85


